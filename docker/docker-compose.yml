version: "3.9"
services:
  country-service:
    build:
      context: ../country-service-main
      dockerfile: ../docker/Dockerfile
    ports:
      - "8081:8081"

    read_only: true
    tmpfs:
      - /tmp:size=64M

    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - SPRING_PROFILES_ACTIVE=prod
